<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none">
  <defs>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="#0D1117"/>
  <rect width="900" height="420" rx="16" fill="none" stroke="rgba(240,242,245,0.04)" stroke-width="1"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#14B8A6">
    <line x1="0" y1="60" x2="900" y2="60" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="900" y2="180" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="900" y2="360" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="420" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="420" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="420" stroke-width="0.5"/>
  </g>

  <!-- Node 1: Customer Wallet -->
  <circle cx="110" cy="210" r="40" fill="rgba(13,148,136,0.12)" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="110" cy="210" r="30" fill="nodeGlow"/>
  <!-- wallet icon -->
  <rect x="92" y="197" width="36" height="26" rx="4" fill="none" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="92" y="203" width="12" height="12" rx="2" fill="#14B8A6" opacity="0.5"/>
  <line x1="100" y1="197" x2="100" y2="191" stroke="#14B8A6" stroke-width="1.5"/>
  <line x1="100" y1="191" x2="120" y2="191" stroke="#14B8A6" stroke-width="1.5"/>
  <line x1="120" y1="191" x2="120" y2="197" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="110" y="265" fill="#94A3B8" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle">Customer</text>
  <text x="110" y="278" fill="#94A3B8" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle">Wallet</text>

  <!-- Arrow 1 with animated dashes feel -->
  <line x1="155" y1="210" x2="245" y2="210" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="245,205 258,210 245,215" fill="#14B8A6" opacity="0.8"/>
  <text x="200" y="198" fill="#64748B" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">Sign intent</text>

  <!-- Node 2: Bundler -->
  <circle cx="310" cy="210" r="36" fill="rgba(6,182,212,0.08)" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <!-- bundler icon: stacked layers -->
  <rect x="295" y="200" width="30" height="6" rx="2" fill="none" stroke="#06B6D4" stroke-width="1.2" opacity="0.7"/>
  <rect x="295" y="209" width="30" height="6" rx="2" fill="none" stroke="#06B6D4" stroke-width="1.2" opacity="0.5"/>
  <rect x="295" y="218" width="30" height="6" rx="2" fill="none" stroke="#06B6D4" stroke-width="1.2" opacity="0.3"/>
  <text x="310" y="260" fill="#94A3B8" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle">Bundler</text>
  <text x="310" y="273" fill="#64748B" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">gasless relay</text>

  <!-- Arrow 2 -->
  <line x1="350" y1="210" x2="440" y2="210" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="440,205 453,210 440,215" fill="#14B8A6" opacity="0.8"/>
  <text x="398" y="198" fill="#64748B" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">Submit tx</text>

  <!-- Node 3: Smart Contract (CENTER, bigger) -->
  <rect x="435" y="150" width="150" height="120" rx="12" fill="rgba(13,148,136,0.08)" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- inner glow -->
  <rect x="440" y="155" width="140" height="110" rx="10" fill="rgba(20,184,166,0.04)"/>
  <!-- shield/contract icon -->
  <path d="M510 170 L530 178 L530 194 Q530 206 510 212 Q490 206 490 194 L490 178 Z" fill="none" stroke="#14B8A6" stroke-width="1.5"/>
  <path d="M502 192 L508 198 L520 184" stroke="#14B8A6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="510" y="228" fill="#F0F2F5" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle" font-weight="600">WPGP</text>
  <text x="510" y="243" fill="#F0F2F5" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle" font-weight="600">Contract</text>
  <!-- Verify / Split labels inside -->
  <text x="510" y="258" fill="#14B8A6" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">verify · split · settle</text>

  <!-- Arrow 3 -->
  <line x1="590" y1="210" x2="652" y2="210" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="652,205 665,210 652,215" fill="#14B8A6" opacity="0.8"/>
  <text x="628" y="198" fill="#64748B" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">Settle</text>

  <!-- Node 4: Merchant Wallet -->
  <circle cx="720" cy="210" r="40" fill="rgba(13,148,136,0.12)" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- wallet icon -->
  <rect x="702" y="197" width="36" height="26" rx="4" fill="none" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="702" y="203" width="12" height="12" rx="2" fill="#14B8A6" opacity="0.5"/>
  <line x1="710" y1="197" x2="710" y2="191" stroke="#14B8A6" stroke-width="1.5"/>
  <line x1="710" y1="191" x2="730" y2="191" stroke="#14B8A6" stroke-width="1.5"/>
  <line x1="730" y1="191" x2="730" y2="197" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="720" y="265" fill="#94A3B8" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle">Merchant</text>
  <text x="720" y="278" fill="#94A3B8" font-size="11" font-family="JetBrains Mono,monospace" text-anchor="middle">Wallet</text>

  <!-- Time badge -->
  <rect x="800" y="188" width="78" height="44" rx="8" fill="rgba(52,211,153,0.1)" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
  <!-- lightning -->
  <path d="M838 196 L831 210 L836 210 L833 222 L844 206 L838 206 Z" fill="#34D399" opacity="0.9"/>
  <text x="839" y="237" fill="#34D399" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">&lt;5s</text>

  <!-- Fee badge near contract -->
  <rect x="455" y="100" width="110" height="28" rx="6" fill="rgba(20,184,166,0.08)" stroke="#14B8A6" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="510" y="118" fill="#14B8A6" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">0.75% fee · atomic</text>
</svg>
